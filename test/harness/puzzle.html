<!doctype html><html><head><meta charset="utf-8"><title>Puzzle harness (test only, not deployed)</title>
<style>
:root{--bg:#0B1016;--panel:#121A23;--panel-2:#18222D;--line:#253241;--ink:#E9EEF4;--muted:#93A2B3;--accent:#E5525B;--good:#3DBA78;--f-body:system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.wrap{display:grid;grid-template-columns:340px 1fr 1fr;gap:12px;padding:12px;height:100vh;box-sizing:border-box}
.col{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0d141b;transform:translateZ(0)}
.col h3{margin:8px 12px;font-size:.8rem;color:var(--muted)}
.col .pz-overlay{position:absolute}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer}
.tabs2{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs2 button{flex:1;background:none;border:0;color:var(--muted);padding:7px;border-radius:7px;font-weight:600;cursor:pointer}
.tabs2 button[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}
</style></head><body><div id="root"></div><script type="module" src="./puzzle.jsx"></script></body></html>
